<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sara ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#ffd6e7,#ffeef5,#fff7fa);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
color:#ff3f84;
}

.container{
text-align:center;
padding:30px;
max-width:700px;
animation:fade 2s ease;
}

h1{
font-size:42px;
margin-bottom:15px;
}

p{
font-size:22px;
line-height:1.8;
opacity:0;
animation:appear 1s forwards;
}

.line1{animation-delay:1s;}
.line2{animation-delay:3s;}
.line3{animation-delay:5s;}
.line4{animation-delay:7s;}

.flower{
position:absolute;
font-size:30px;
animation:float 10s linear infinite;
opacity:.8;
}

.f1{left:10%;animation-delay:0s;}
.f2{left:30%;animation-delay:2s;}
.f3{left:50%;animation-delay:4s;}
.f4{left:70%;animation-delay:1s;}
.f5{left:90%;animation-delay:3s;}

@keyframes float{
0%{
transform:translateY(100vh) rotate(0deg);
}
100%{
transform:translateY(-120vh) rotate(360deg);
}
}

@keyframes appear{
to{
opacity:1;
transform:translateY(0);
}
from{
opacity:0;
transform:translateY(20px);
}
}

@keyframes fade{
from{
opacity:0;
transform:scale(.95);
}
to{
opacity:1;
transform:scale(1);
}
}
</style>
</head>

<body>

<div class="flower f1">🌸</div>
<div class="flower f2">🌷</div>
<div class="flower f3">🌺</div>
<div class="flower f4">🌹</div>
<div class="flower f5">💐</div>

<div class="container">
<h1>Happy Birthday Sara 💞</h1>

<p class="line1">Feeling so blessed to have you in my life. 🥺🎀</p>

<p class="line2">May your smile never fade and may every dream of yours come true. 🌸</p>

<p class="line3">You deserve endless happiness, love, and beautiful memories. 💖</p>

<p class="line4"><strong>With Love,<br>Nawaf ❤️</strong></p>
</div>

</body>
</html>
